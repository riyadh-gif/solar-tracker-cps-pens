# Jembatan ros_gz untuk solar_tracker (mode pid). Perintah posisi (rad) diteruskan wind_node.py dari /solar_tracker/*_cmd ke *_cmd_gz (ditambah angin), masuk ke Gazebo, keadaan sendi dan jam keluar ke ROS 2.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/solar_world/model/solar_tracker/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/solar_tracker/azimuth_cmd_gz"
  gz_topic_name: "/model/solar_tracker/joint/azimuth_joint/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/solar_tracker/elevation_cmd_gz"
  gz_topic_name: "/model/solar_tracker/joint/elevation_joint/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
