# Jembatan ros_gz untuk solar_tracker_v2 (desain baru: reduksi gigi 5.25:1 pada kemiringan).
# Nama topik ROS sengaja SAMA dengan desain lama (/solar_tracker/*) supaya seluruh node berpindah
# tanpa diubah; yang berganti hanya nama model di sisi Gazebo (solar_tracker_v2).
# Perintah posisi diteruskan wind_node.py dari /solar_tracker/*_cmd ke *_cmd_gz (ditambah angin).
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/solar_world/model/solar_tracker_v2/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/solar_tracker/azimuth_cmd_gz"
  gz_topic_name: "/model/solar_tracker_v2/joint/azimuth_joint/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/solar_tracker/elevation_cmd_gz"
  gz_topic_name: "/model/solar_tracker_v2/joint/elevation_joint/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
